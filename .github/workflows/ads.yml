name: Check proxies for injected ads

# Manual-only on purpose.
#
# This workflow drives a real Telegram *user account* through public proxies
# (help.getPromoData) to find out which ones inject a sponsored channel. It is
# never scheduled, because unattended account use is both a security and an
# anti-spam risk. Read the "Advertising" section of FIXES.md first.
#
# Required repository secrets:
#   TELEGRAM_API_ID    - from https://my.telegram.org
#   TELEGRAM_API_HASH  - from https://my.telegram.org
#   TELEGRAM_SESSION   - a Telethon StringSession of a DEDICATED account
#
# Results are committed to the `data` branch (proxies/ads.json) and the Pages
# site is rebuilt so the metadata is served immediately.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many proxies to probe"
        required: false
        default: "20"
      force:
        description: "Ignore cached results"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # push the data branch
  pages: write      # rebuild the site
  id-token: write   # OIDC for the Pages deployment

concurrency:
  group: mtproto-ads-check
  cancel-in-progress: false

env:
  DATA_DIR: .data/proxies
  SITE_DIR: public

jobs:
  ads:
    name: Probe proxies for promoted channels
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # actions/checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # adcheck.py only needs Telethon; the collector code is imported from
          # src/ and has no third-party runtime dependency of its own beyond the
          # standard library.
          pip install -r requirements-ads.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Prepare data branch worktree
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --quiet origin data
          git worktree add -B data .data origin/data
          mkdir -p "$DATA_DIR"
          ls -la "$DATA_DIR"

      - name: Probe proxies
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python src/adcheck.py --from-endpoints --limit "${{ inputs.limit }}" ${{ inputs.force && '--force' || '' }}

      - name: Publish ads.json to the data branch
        run: |
          set -euo pipefail

          git -C .data add -A proxies/ads.json

          if git -C .data diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git -C .data diff --cached --stat
          git -C .data commit -q -m "Update ads.json"

          git -C .data fetch --quiet origin data || true
          git -C .data rebase origin/data || true
          git -C .data push origin HEAD:data

      - name: Build Pages site
        run: |
          python -m src.publish \
            --data-dir "$DATA_DIR" \
            --site-dir "$SITE_DIR" \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Configure Pages
        # actions/configure-pages v5
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true

      - name: Upload Pages artifact
        # actions/upload-pages-artifact v3
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ env.SITE_DIR }}

      - name: Upload results
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mtproto-ads-results
          include-hidden-files: true
          path: ${{ env.DATA_DIR }}/ads.json
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: ads
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        # actions/deploy-pages v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
