name: Update MTProto proxy list

# Architecture (see FIXES.md, "Iteration 4"):
#   main  -> code only
#   data  -> generated files + state.json (kept in a worktree at .data/)
#   Pages -> the public, stable URLs served from the built site (public/)
#
# Scheduling note: GitHub throttles frequent schedules hard (a 15-minute cron
# actually ran ~4.5 times/day), so every 2 hours loses nothing in practice.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # push the data branch
  pages: write      # deploy the site
  id-token: write   # OIDC for the Pages deployment

concurrency:
  group: mtproto-proxy-update
  cancel-in-progress: false

env:
  DATA_DIR: .data/proxies
  SITE_DIR: public

jobs:
  update:
    name: Collect, verify and publish data
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        # actions/checkout v4.4.0 — pinned by SHA (tags are mutable).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The checker is a VCS dependency pinned to a commit SHA and installed
          # without dependency resolution: cryptography is pinned above.
          pip install --no-deps -r requirements-vcs.txt

      - name: Unit tests
        # stdlib only, no network: parsing, selection, publish guard, DNS cache,
        # stability ranking, site builder and the published JSON schemas.
        run: python -m unittest discover -s tests -v

      - name: Prepare data branch worktree
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --quiet origin data || true

          if git rev-parse --verify --quiet origin/data >/dev/null; then
            git worktree add -B data .data origin/data
          else
            echo "::notice::the data branch does not exist yet — creating an orphan one"
            git worktree add --detach .data
            git -C .data checkout --orphan data
            git -C .data rm -rf --cached . >/dev/null 2>&1 || true
            find .data -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git -C .data commit --allow-empty -m "Initialize the data branch"
          fi

          mkdir -p "$DATA_DIR"
          echo "Data worktree:"
          ls -la .data
          echo "Existing data files:"
          ls -la "$DATA_DIR" || true

      - name: Collect and verify MTProto proxies
        env:
          PYTHONUNBUFFERED: "1"
          # Tuning is env-driven; see src/collector.py::Config.from_env.
          MAX_CANDIDATES: "400"
          MIN_DISCOVERED: "10"
          MIN_KEEP_RATIO: "0.25"
          STABLE_TTL_HOURS: "24"
          BEST_COUNT: "20"
          DNS_CACHE_HOURS: "6"
          # Uncomment to also require specific Telegram DCs (slower, stricter):
          # CHECK_DCS: "2,4"
        run: |
          python src/collector.py
          # Exit code 2 means the publish guard tripped. The previous data in the
          # data branch is kept untouched and the job turns red on purpose.

      - name: Publish data branch
        run: |
          set -euo pipefail

          # Never publish anything the collector flagged as degraded.
          if ! python -c "import json,sys; sys.exit(0 if json.load(open('$DATA_DIR/stats.json')).get('published') else 1)"; then
            echo "::error::$DATA_DIR/stats.json reports published=false — refusing to publish."
            exit 1
          fi

          git -C .data add -A proxies

          if git -C .data diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          git -C .data diff --cached --stat

          verified=$(python -c "import json; print(json.load(open('$DATA_DIR/stats.json'))['mtproto_verified'])")
          git -C .data commit -q -m "Update proxy data (${verified} verified)"

          git -C .data fetch --quiet origin data || true
          git -C .data rebase origin/data || true
          git -C .data push origin HEAD:data

      - name: Build Pages site
        run: |
          python -m src.publish \
            --data-dir "$DATA_DIR" \
            --site-dir "$SITE_DIR" \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Configure Pages
        # actions/configure-pages v5 — enablement lets the workflow create the
        # Pages site itself if it has not been enabled in the repository yet.
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true

      - name: Upload Pages artifact
        # actions/upload-pages-artifact v3
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ env.SITE_DIR }}

      - name: Upload run artifact
        if: always()
        # actions/upload-artifact v4.6.2 — hidden files are excluded by default,
        # hence include-hidden-files for the .data worktree.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mtproto-run-data
          include-hidden-files: true
          path: |
            ${{ env.DATA_DIR }}/all.txt
            ${{ env.DATA_DIR }}/working.txt
            ${{ env.DATA_DIR }}/stable.txt
            ${{ env.DATA_DIR }}/best.txt
            ${{ env.DATA_DIR }}/badge.json
            ${{ env.DATA_DIR }}/stats.json
            ${{ env.DATA_DIR }}/endpoints.json
            ${{ env.DATA_DIR }}/state.json
            ${{ env.DATA_DIR }}/ads.json
          if-no-files-found: warn
          retention-days: 7

      - name: Show generated statistics
        if: always()
        run: |
          echo "===== Proxy statistics ====="

          if [ -f "$DATA_DIR/stats.json" ]; then
            python -m json.tool "$DATA_DIR/stats.json" | head -60
          else
            echo "stats.json not found"
          fi

          echo
          echo "===== Line counts ====="

          for name in all working stable best; do
            file="$DATA_DIR/${name}.txt"
            if [ -f "$file" ]; then
              printf '%s: %s lines\n' "$name.txt" "$(wc -l < "$file")"
            else
              echo "$name.txt not found"
            fi
          done

  deploy:
    name: Deploy to GitHub Pages
    needs: update
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        # actions/deploy-pages v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
